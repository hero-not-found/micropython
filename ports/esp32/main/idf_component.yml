## IDF Component Manager Manifest File
dependencies:
  espressif/mdns: 1.1.0
  espressif/gmf_audio: 0.8.0
  espressif/gmf_io: 0.8.0
  espressif/esp_audio_render: 0.8.0
  espressif/esp_codec_dev: 1.5.7
  espressif/gmf_ai_audio:
    version: 0.8.0
    rules:
    - if: target in [esp32, esp32s3, esp32p4]
  espressif/esp_tinyusb:
    rules:
    - if: target in [esp32s2, esp32s3]
    version: 1.0.3
  espressif/iot_usbh_rndis:
    rules:
    - if: target in [esp32s2, esp32s3, esp32p4]
    version: ^0.3.1
  espressif/lan867x:
    version: 1.0.0
    rules:
    - if: target == esp32
    - if: idf_version >=5.3
  idf:
    version: '>=5.2.0'
  espressif/esp_image_effects: ^1.0.1
